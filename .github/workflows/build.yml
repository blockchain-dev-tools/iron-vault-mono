name: Build on tag

on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix pnpm hoisting for React Native Gradle
        run: |
          # pnpm hoists deps to root node_modules; Gradle expects them in apps/mobile/node_modules
          mkdir -p apps/mobile/node_modules/@react-native
          ln -sf "$(pwd)/node_modules/@react-native/gradle-plugin" apps/mobile/node_modules/@react-native/gradle-plugin

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Build debug APK
        run: |
          cd apps/mobile/android
          ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios
          bundle install
          bundle exec pod install

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update Info.plist version
        run: |
          cd apps/mobile/ios/IronVault
          plutil -replace CFBundleShortVersionString -string "$VERSION" Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Info.plist

      - name: Bundle JS
        run: |
          cd apps/mobile
          npx react-native bundle \
            --entry-file index.js \
            --platform ios \
            --dev false \
            --bundle-output ios/build/main.jsbundle \
            --assets-dest ios/build/assets

      - name: Build archive (unsigned)
        run: |
          cd apps/mobile/ios
          xcodebuild archive \
            -workspace IronVault.xcworkspace \
            -scheme BleWalletRN \
            -configuration Release \
            -archivePath build/IronVault.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          cd apps/mobile/ios
          mkdir -p build/Payload
          cp -r build/IronVault.xcarchive/Products/Applications/IronVault.app build/Payload/
          cd build && zip -r IronVault-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-ipa
          path: apps/mobile/ios/build/IronVault-unsigned.ipa

  release:
    name: Upload to GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ironvault-apk/*
            artifacts/ironvault-ipa/*
          generate_release_notes: true
