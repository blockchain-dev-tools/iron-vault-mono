<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>验证助记词 - Verify Mnemonic</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8FC322",
                        "background": "#000000",
                        "surface": "#0A0A0A",
                        "card-bg": "#141414",
                        "error": "#EA4335",
                        "on-surface-variant": "#888888"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Manrope", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                    },
                },
            },
        }
    </script>
<style>
        body {
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(143, 195, 34, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .mnemonic-option {
            transition: all 0.15s ease-in-out;
        }
    </style>
</head>
<body class="font-body text-white min-h-screen flex flex-col">
<!-- Header -->
<header class="w-full sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-white/5">
<div class="flex items-center h-14 px-4 w-full max-w-screen-xl mx-auto">
<button class="mr-4 text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-lg tracking-tight text-primary">验证助记词</h1>
</div>
</header>
<main class="flex-grow w-full max-w-md mx-auto px-6 py-8 flex flex-col gap-10">
<!-- Instruction Section -->
<section class="space-y-3">
<div class="flex items-center gap-3">
<div class="w-1.5 h-6 bg-primary shadow-[0_0_12px_rgba(143,195,34,0.4)]"></div>
<h2 class="font-headline font-bold text-2xl tracking-tighter uppercase">安全验证</h2>
</div>
<p class="text-on-surface-variant text-sm leading-relaxed">请按照您备份的顺序选择对应的助记词，以确保备份正确。</p>
</section>
<!-- Verification Flow -->
<div class="flex flex-col gap-12">
<!-- Step 01: Correct Selection Example -->
<div class="space-y-4">
<div class="flex justify-between items-baseline border-b border-white/5 pb-2">
<span class="font-headline text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">Step 01</span>
<h3 class="font-headline font-semibold text-white text-base">请选择第 <span class="text-primary">3</span> 个词</h3>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">cherry</button>
<button class="mnemonic-option py-4 px-4 bg-primary/15 border border-primary rounded font-headline text-sm text-primary shadow-[0_0_10px_rgba(143,195,34,0.15)]">dial</button>
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">fabric</button>
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">galaxy</button>
</div>
</div>
<!-- Step 02: Error State Example -->
<div class="space-y-4">
<div class="flex justify-between items-baseline border-b border-white/5 pb-2">
<span class="font-headline text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">Step 02</span>
<h3 class="font-headline font-semibold text-white text-base">请选择第 <span class="text-primary">7</span> 个词</h3>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">asset</button>
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">binary</button>
<button class="mnemonic-option py-4 px-4 bg-error/15 border border-error rounded font-headline text-sm text-error shadow-[0_0_10px_rgba(234,67,53,0.15)]">cactus</button>
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">deputy</button>
</div>
<p class="text-error text-[11px] font-headline uppercase tracking-wider flex items-center gap-1.5 pl-1">
<span class="material-symbols-outlined text-xs" data-icon="error">error</span> 助记词顺序不正确，请重新检查
                </p>
</div>
<!-- Step 03: Default State Example -->
<div class="space-y-4">
<div class="flex justify-between items-baseline border-b border-white/5 pb-2">
<span class="font-headline text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">Step 03</span>
<h3 class="font-headline font-semibold text-white text-base">请选择第 <span class="text-primary">11</span> 个词</h3>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">energy</button>
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">fossil</button>
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">guitar</button>
<button class="mnemonic-option py-4 px-4 bg-card-bg border border-transparent rounded font-headline text-sm hover:bg-white/5">humble</button>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="mt-auto py-8 flex flex-col items-center gap-6">
<button class="w-full py-4 bg-primary text-black font-headline font-bold rounded shadow-[0_4px_20px_rgba(143,195,34,0.3)] active:scale-[0.98] transition-all uppercase tracking-widest">
                下一步
            </button>
<a class="text-on-surface-variant text-xs underline underline-offset-4 decoration-white/20 hover:text-white transition-colors uppercase tracking-widest" href="#">
                跳过验证 (不推荐)
            </a>
</div>
</main>
</body></html>
