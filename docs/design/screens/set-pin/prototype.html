<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vault - Set PIN</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#8FC322",
              "background": "#000000",
              "surface": "#000000",
              "surface-container": "#1A1A1A",
              "surface-container-highest": "#1A1A1A",
              "on-surface": "#FFFFFF",
              "on-surface-variant": "#949494",
              "outline-variant": "#262626",
              "tertiary": "#8FC322"
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "4px",
              "lg": "4px",
              "xl": "4px",
              "full": "4px"
            },
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background flex justify-between items-center px-6 h-16 w-full max-w-none">
<div class="flex items-center gap-4">
<button class="p-2 text-white hover:bg-white/10 transition-colors active:scale-95 duration-100 rounded-none">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-lg font-bold tracking-tight text-white">Set PIN</h1>
</div>
<div class="flex items-center">
<button class="p-2 text-white hover:bg-white/10 transition-colors active:scale-95 duration-100 rounded-none">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-16 pb-32 px-6">
<!-- Instruction Group -->
<div class="text-center mb-12">
<div class="inline-flex items-center justify-center mb-6">
<div class="w-12 h-12 bg-primary/10 rounded-none flex items-center justify-center border border-primary/20">
<span class="material-symbols-outlined text-primary" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
</div>
<h2 class="font-headline text-2xl font-bold text-white mb-2 tracking-tight">Set a 6-digit numeric PIN</h2>
<p class="font-body text-sm text-on-surface-variant max-w-[280px] mx-auto">This PIN will be required to authorize transactions and access your secure vault.</p>
</div>
<!-- PIN Display Area -->
<div aria-label="PIN entry visualization" class="flex gap-4 mb-16">
<!-- Filled Dot -->
<div class="w-4 h-4 rounded-none bg-primary shadow-[0_0_12px_rgba(143,195,34,0.5)]"></div>
<!-- Filled Dot -->
<div class="w-4 h-4 rounded-none bg-primary shadow-[0_0_12px_rgba(143,195,34,0.5)]"></div>
<!-- Filled Dot -->
<div class="w-4 h-4 rounded-none bg-primary shadow-[0_0_12px_rgba(143,195,34,0.5)]"></div>
<!-- Empty Dot -->
<div class="w-4 h-4 rounded-none bg-surface-container-highest border border-white/10"></div>
<!-- Empty Dot -->
<div class="w-4 h-4 rounded-none bg-surface-container-highest border border-white/10"></div>
<!-- Empty Dot -->
<div class="w-4 h-4 rounded-none bg-surface-container-highest border border-white/10"></div>
</div>
<!-- Secure 3x4 Numeric Keypad -->
<div class="grid grid-cols-3 gap-3 w-full max-w-[320px]">
<!-- Row 1 -->
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">1</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">2</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">3</span>
</button>
<!-- Row 2 -->
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">4</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">5</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">6</span>
</button>
<!-- Row 3 -->
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">7</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">8</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">9</span>
</button>
<!-- Row 4 (Action Row) -->
<button class="aspect-square flex flex-col items-center justify-center bg-transparent rounded-none active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined text-white/70 text-3xl" data-icon="backspace">backspace</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container rounded-none active:bg-primary transition-colors duration-100 group">
<span class="font-headline text-2xl font-bold text-white group-active:text-black">0</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-primary rounded-none active:bg-primary/80 transition-colors duration-100 group shadow-[0_0_20px_rgba(143,195,34,0.3)]">
<span class="material-symbols-outlined text-black text-3xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>
</main>
<!-- Bottom Info Panel -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] z-40">
<div class="bg-surface-container/80 backdrop-blur-xl rounded-none px-6 py-4 flex items-center justify-between shadow-2xl border border-white/10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label text-xs uppercase tracking-[0.15em] text-white">End-to-End Encrypted</span>
</div>
<div class="w-2 h-2 rounded-full bg-primary animate-pulse shadow-[0_0_8px_rgba(143,195,34,0.6)]"></div>
</div>
</div>
</body></html>
