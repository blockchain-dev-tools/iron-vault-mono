<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vault - Welcome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8FC322",
                        "on-primary": "#000000",
                        "background": "#000000",
                        "surface": "#1A1A1A",
                        "on-surface": "#FFFFFF",
                        "on-surface-variant": "#999999",
                        "outline-variant": "#333333",
                        "tertiary": "#8FC322",
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hero-gradient {
            background: radial-gradient(circle at center, rgba(143, 195, 34, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
        }
        .glass-panel {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(20px);
        }
        body {
            min-height: max(884px, 100dvh);
            background-color: #000000;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#000000]/80 backdrop-blur-md">
<div class="flex justify-between items-center px-6 h-16 w-full max-w-none">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="shield">shield</span>
<span class="font-headline text-lg font-bold tracking-tight text-white">Vault</span>
</div>
<div class="flex items-center gap-4">
<button class="p-2 text-white hover:bg-white/10 transition-colors rounded-xl active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-16 pb-24 relative overflow-hidden">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 hero-gradient pointer-events-none"></div>
<!-- Asymmetric Decorative Element -->
<div class="absolute top-1/4 -right-24 w-64 h-64 bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-1/4 -left-24 w-64 h-64 bg-white/5 blur-[120px] rounded-full"></div>
<!-- Hero Content Section -->
<div class="w-full max-w-md flex flex-col items-center text-center z-10">
<!-- Central Visual Anchor -->
<div class="mb-12 relative">
<div class="w-32 h-32 rounded-3xl bg-surface flex items-center justify-center relative overflow-hidden group border border-outline-variant">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-7xl text-primary" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<!-- Pulsing BLE Indicator -->
<div class="absolute -bottom-2 -right-2 flex items-center justify-center w-8 h-8">
<div class="absolute w-full h-full bg-primary/20 rounded-full animate-ping"></div>
<div class="w-3 h-3 bg-primary rounded-full border-2 border-background"></div>
</div>
</div>
<div class="space-y-4 mb-16">
<h1 class="font-headline text-5xl font-bold tracking-tighter text-white">
                    OldPhone <span class="text-primary">Wallet</span>
</h1>
<p class="text-on-surface-variant font-body text-lg max-w-[280px] mx-auto leading-relaxed">
                    Transform your old phone into a secure <span class="text-white font-semibold underline decoration-primary/40">hardware wallet</span>.
                </p>
</div>
<!-- Action Grid -->
<div class="w-full grid grid-cols-1 gap-4">
<button class="group relative flex items-center justify-between p-6 bg-primary text-on-primary rounded-xl overflow-hidden transition-all active:scale-[0.98]">
<div class="flex flex-col items-start text-left">
<span class="font-headline font-bold text-xl">Create New Wallet</span>
<span class="text-[10px] opacity-70 font-label tracking-widest uppercase font-bold">Generates 24-word seed</span>
</div>
<span class="material-symbols-outlined text-3xl group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="flex items-center justify-between p-6 bg-surface border border-outline-variant text-white rounded-xl transition-all hover:bg-[#252525] active:scale-[0.98]">
<div class="flex flex-col items-start text-left">
<span class="font-headline font-medium text-xl">Import Existing Wallet</span>
<span class="text-[10px] text-on-surface-variant font-label tracking-widest uppercase font-bold">Recovery Phrase or Private Key</span>
</div>
<span class="material-symbols-outlined text-3xl text-on-surface-variant" data-icon="file_upload">file_upload</span>
</button>
</div>
<!-- Security Proof Card -->
<div class="mt-12 p-4 glass-panel rounded-xl w-full flex items-center gap-4 border border-white/5">
<div class="bg-primary/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary" data-icon="verified_user">verified_user</span>
</div>
<div class="text-left">
<p class="text-[10px] font-bold font-label uppercase tracking-[0.2em] text-primary">Air-Gapped Ready</p>
<p class="text-sm text-on-surface-variant">Private keys never touch the internet.</p>
</div>
</div>
</div>
</main>
<div class="h-6"></div>
<!-- Background Image Asset (Abstract Security) -->
<div class="fixed inset-0 -z-10 opacity-10 grayscale invert pointer-events-none">
<img alt="" class="w-full h-full object-cover" data-alt="Abstract dark cinematic background with floating digital geometric particles and soft blue light streaks representing cybersecurity and encryption" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmDOAJuCriu8CoEI9K8SrYKWz98hPGeI8EYiLlDeQ9QCOvhiPwA3bERsKhqV4renZ2ibtblIRyNvTOngSGZSPntVoFU_L043AF4L_lb-ftjTChraO3QrWKvNXvU98J7Av_pA4RSsApVXjee0fC8oZIBcn3hNfME2Nu4WSuCIyA3ytTCEZE-MyTvA5L6JK93ZYiul0suozzdtZz8ZuG2hAqiyB3JftQqVnl8u4NHk--3-0JxFtzKXQHmDC9yPhD7i4R4Si-2_uO0UQK"/>
</div>
</body></html>
