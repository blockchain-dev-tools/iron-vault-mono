<!DOCTYPE html>

<html class="dark" lang="zh"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .grid-bg {
            background-image: radial-gradient(#333333 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .monolithic-btn {
            background: #1A1A1A;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .monolithic-btn:active {
            background: #262626;
            transform: scale(0.96);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body selection:bg-primary selection:text-black antialiased overflow-hidden">
<!-- Micro-grid Background -->
<div class="fixed inset-0 grid-bg opacity-20 pointer-events-none"></div>
<main class="relative z-10 min-h-screen flex flex-col items-center justify-between px-8 py-16 max-w-md mx-auto">
<!-- Header Section -->
<header class="flex flex-col items-center space-y-4">
<div class="w-16 h-16 bg-surface-container flex items-center justify-center rounded-lg border border-outline/50 shadow-2xl">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-headline font-bold text-2xl tracking-tight text-white">OldPhone Wallet</h1>
</header>
<!-- PIN Input Section -->
<section class="flex flex-col items-center space-y-8 w-full">
<div class="text-on-surface-variant font-label text-sm uppercase tracking-[0.2em]">请输入 PIN</div>
<div class="flex space-x-4">

<div class="w-4 h-4 rounded-full border-2 border-primary/30"></div>
<div class="w-4 h-4 rounded-full border-2 border-primary/30"></div>
<div class="w-4 h-4 rounded-full border-2 border-primary/30"></div>
<div class="w-4 h-4 rounded-full border-2 border-primary/30"></div>
<div class="w-4 h-4 rounded-full border-2 border-primary/30"></div>
<div class="w-4 h-4 rounded-full border-2 border-primary/30"></div>
</div>
</section>
<!-- Keypad Section -->
<section class="grid grid-cols-3 gap-4 w-full max-w-[320px]">
<!-- Row 1 -->
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">1</button>
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">2</button>
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">3</button>
<!-- Row 2 -->
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">4</button>
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">5</button>
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">6</button>
<!-- Row 3 -->
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">7</button>
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">8</button>
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">9</button>
<!-- Row 4 -->
<div class="h-16"></div> <!-- Empty spacer -->
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-2xl font-mono text-white">0</button>
<button class="monolithic-btn h-16 flex items-center justify-center rounded border border-outline/30 text-white">
<span class="material-symbols-outlined text-3xl" data-icon="backspace">backspace</span>
</button>
</section>
<!-- Footer Warning -->
<footer class="text-center w-full">
<div class="inline-flex items-center space-x-2 bg-error/5 border border-error/20 px-4 py-2 rounded">
<span class="material-symbols-outlined text-error text-[18px]" data-icon="warning">warning</span>
<p class="text-on-surface-variant font-label text-[10px] tracking-wider uppercase">
                    连续错误 5 次将锁定 30 分钟
                </p>
</div>
</footer>
</main>
<!-- Bottom Aesthetic Edge Gradient -->
<div class="fixed bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary/50 to-transparent blur-sm"></div>
