<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar Execution -->
<header class="fixed top-0 w-full z-50 bg-black border-b-2 border-[#1A1A1A] flex items-center justify-between px-6 h-16 max-w-none">
<div class="flex items-center gap-4">
<button class="text-[#8FC322] active:scale-95 duration-100 transition-all">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<h1 class="text-[#8FC322] font-['Inter'] font-bold tracking-tight uppercase text-sm">SYSTEM_SETTINGS</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#8FC322]" data-icon="shield">shield</span>
<span class="material-symbols-outlined text-gray-500" data-icon="sensors">sensors</span>
</div>
</header>
<main class="flex-grow pt-20 pb-24 px-4 max-w-2xl mx-auto w-full">
<!-- Security Section -->
<section class="mb-8">
<h2 class="text-[10px] font-medium tracking-[0.2em] text-on-surface-variant uppercase mb-3 px-2">安全 (SECURITY)</h2>
<div class="bg-surface rounded shadow-sm overflow-hidden">
<!-- Row: Change PIN -->
<div class="flex items-center justify-between p-4 active:bg-surface-container-high transition-colors cursor-pointer border-b border-outline hover:brightness-110">
<span class="text-sm font-medium">修改 PIN</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
<!-- Row: Backup -->
<div class="flex items-center justify-between p-4 active:bg-surface-container-high transition-colors cursor-pointer border-b border-outline hover:brightness-110">
<span class="text-sm font-medium">备份助记词</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
<!-- Row: Auto-lock (No Chevron) -->
<div class="flex items-center justify-between p-4 border-outline">
<span class="text-sm font-medium">自动锁定时间</span>
<span class="text-sm font-mono text-primary">5 分钟</span>
</div>
</div>
</section>
<!-- BLE Section -->
<section class="mb-8">
<h2 class="text-[10px] font-medium tracking-[0.2em] text-on-surface-variant uppercase mb-3 px-2">BLE</h2>
<div class="bg-surface rounded shadow-sm overflow-hidden monolith-border">
<!-- Row: Device Name -->
<div class="flex items-center justify-between p-4 active:bg-surface-container-high transition-colors cursor-pointer hover:brightness-110">
<span class="text-sm font-medium">设备名称</span>
<div class="flex items-center gap-2">
<span class="text-sm font-mono text-on-surface-variant">Nano X</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</div>
</section>
<!-- About Section -->
<section class="mb-8">
<h2 class="text-[10px] font-medium tracking-[0.2em] text-on-surface-variant uppercase mb-3 px-2">关于 (ABOUT)</h2>
<div class="bg-surface rounded shadow-sm overflow-hidden">
<!-- Row: Version -->
<div class="flex items-center justify-between p-4 border-b border-outline">
<span class="text-sm font-medium">版本</span>
<span class="text-sm font-mono text-on-surface-variant">0.1.0</span>
</div>
<!-- Row: Check Updates -->
<div class="flex items-center justify-between p-4 active:bg-surface-container-high transition-colors cursor-pointer hover:brightness-110">
<span class="text-sm font-medium">检查更新</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</section>
<!-- Danger Zone -->
<section class="mt-12">
<button class="w-full bg-surface border border-error text-error py-4 px-6 rounded text-xs font-bold tracking-[0.1em] uppercase active:scale-[0.98] active:bg-error active:text-white transition-all duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="warning">warning</span>
                重置钱包（危险）
            </button>
<p class="text-[10px] text-center text-on-surface-variant mt-4 leading-relaxed px-6 tracking-wide">
                警告：此操作将永久抹除所有钱包数据。请确保您已备份助记词。
            </p>
</section>
</main>
<!-- BottomNavBar Execution -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-stretch h-20 bg-[#000000] z-50 border-t border-[#1A1A1A]">

<span class="font-['Inter'] text-[10px] font-medium tracking-[0.2em] uppercase">CONNECT</span>
</a>

<a class="flex flex-col items-center justify-center text-[#8FC322] border-l-2 border-[#8FC322] bg-[#1A1A1A] py-2 w-full hover:bg-[#262626] transition-colors active:brightness-125" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-[0.2em] uppercase">SETTINGS</span>
</a>
